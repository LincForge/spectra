[project]
name = "linc-spectra"
version = "0.1.0"
description = "AI-driven mobile debugging — spectral analysis of running apps"
readme = "README.md"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
]
requires-python = ">=3.13"
authors = [
    { name = "LINC Innovations" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "mcp>=1.0.0",
    "python-dateutil>=2.8.2",
    "structlog>=25.0",
    "linc-cli-kit>=0.1.4",
]

[project.urls]
Homepage = "https://github.com/LincForge/spectra"
Source = "https://github.com/LincForge/spectra"
Issues = "https://github.com/LincForge/spectra/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "bandit>=1.7",
    "mutmut>=3.5,<4",
    "pre-commit>=4.0",
]

[project.scripts]
spectra = "linc_spectra.cli:main"
linc-spectra = "linc_spectra.cli:main"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
extend-select = [
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"src/linc_spectra/mcp_server.py" = [
    "E501",
    "SIM115",
]
"tests/**" = [
    "S101",
]
"**/test_*.py" = [
    "S101",
]
"**/*_test.py" = [
    "S101",
]
"**/conftest.py" = [
    "S101",
]
"**/testing.py" = [
    "S101",
]

[tool.ruff.lint.isort]
known-first-party = [
    "linc_spectra",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
markers = [
    "integration: requires real devices (deselect with -m 'not integration')",
    "device: touches a real device or simulator; deselected by the publish selfcheck",
]

[build-system]
requires = [
    "setuptools>=77.0",
]
build-backend = "setuptools.build_meta"
